name: Weekly GitHub Radar

on:
  schedule:
    # Tuesday 04:25 Asia/Shanghai (Monday 20:25 UTC).
    - cron: "25 20 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重做本周推荐"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-desk-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Bailian secret
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: test -n "$DASHSCOPE_API_KEY"

      - name: Detect content branch
        id: content-branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing content branch
        if: steps.content-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: content
          path: content-store

      - name: Checkout seed for first content migration
        if: steps.content-branch.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          path: content-store

      - name: Initialize first content branch
        if: steps.content-branch.outputs.exists == 'false'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/content-store"
          git switch --orphan content
          git rm -rf --ignore-unmatch .
          mkdir -p data
          if [ -d "$GITHUB_WORKSPACE/public/data" ]; then
            cp -a "$GITHUB_WORKSPACE/public/data/." data/
          fi
          mkdir -p data/archive data/github/archive

      - name: Generate weekly GitHub recommendations
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
          DASHSCOPE_SELECTION_MODEL: ${{ vars.DASHSCOPE_SELECTION_MODEL || 'qwen3.7-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_DATA_DIR: ${{ github.workspace }}/content-store/data
          SIGNAL_GITHUB_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: npm run generate:github

      - name: Validate code and GitHub data
        env:
          SIGNAL_DATA_DIR: ${{ github.workspace }}/content-store/data
        run: npm test && npm run check && node scripts/validate-github-feed.js

      - name: Persist generated content branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/content-store"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json data/github
          if ! git diff --cached --quiet; then
            git commit -m "content: update GitHub radar $(date -u +%F)"
            git push origin HEAD:content
          fi

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p site
          cp -a public/. site/
          rm -rf site/data
          cp -a "$GITHUB_WORKSPACE/content-store/data" site/data

      - name: Verify published artifact has no secrets
        shell: bash
        run: |
          if grep -R -E "DASHSCOPE_API_KEY|GITHUB_TOKEN|sk-[A-Za-z0-9_-]{16,}" site; then
            echo "Potential secret found in Pages artifact" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
